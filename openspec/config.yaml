schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  ByteBills is a Next.js 15 / React 19 / TypeScript app (App Router, Tailwind, shadcn/ui, Firebase Auth + Firestore) for German freelancers.
  Documents: invoices, receipts, delivery notes, costs (cost_invoice, cost_partial_business_use, cost_afa, cost_pauschale).
  Reporting uses persisted EUR fields (BMF Umsatzsteuer-Umrechnungskurse). Do not invent live FX at report time.
  EÜR (Einnahmen-Überschuss-Rechnung) annual hints already exist: lib/eur-annual-summary.ts, lib/eur-euer-yearly.ts, shown only on /reports for thisYear/lastYear.
  ELSTER quarterly VAT lives on /reports; keep it there. Auth-gated pages redirect to /auth/login.
  UI copy: bilingual EN/DE via lib/translations.ts where report strings already exist.
  Do not claim to replace a Steuerberater; keep the existing tax-advice disclaimer.

